<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FloorSight Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Spline+Sans+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#0b0f16;--panel:#121826;--ink:#eef2f6;--ink2:#a9b4c0;--muted:#67737f;--blue:#3987e5;--red:#e05c5c;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:var(--bg);color:var(--ink);display:grid;place-items:center;
  font-family:"Spline Sans Mono",ui-monospace,SFMono-Regular,monospace;padding:24px}
.card{width:min(420px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:38px 36px;text-align:center}
.mark{width:44px;height:44px;border-radius:12px;background:var(--blue);color:#fff;display:inline-grid;
  place-items:center;font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-size:22px;margin-bottom:16px}
h1{font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.01em;color:var(--ink)}
p.sub{font-size:13px;color:var(--ink2);margin:10px 0 26px;line-height:1.6}
input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
  color:var(--ink);font:inherit;font-size:15px;text-align:center;letter-spacing:.06em}
input:focus{outline:2px solid var(--blue);outline-offset:2px}
button{width:100%;margin-top:12px;padding:13px;border-radius:10px;border:none;background:var(--blue);
  color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.55;cursor:wait}
.msg{min-height:22px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.msg.err{color:var(--red)}
.foot{margin-top:22px;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<form class="card" id="f">
  <div class="mark">F</div>
  <h1>FloorSight Console</h1>
  <p class="sub">This demo is access-controlled.<br>Enter the access code you were given.</p>
  <input id="code" type="password" placeholder="access code" autocomplete="current-password" autofocus aria-label="Access code">
  <button id="go" type="submit">Unlock</button>
  <div class="msg" id="msg"></div>
  <div class="foot">FloorSight &middot; dealer risk intelligence &middot; content encrypted at rest</div>
</form>

const bin = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const msg = document.getElementById("msg"), btn = document.getElementById("go"), inp = document.getElementById("code");
async function unlock(code){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:bin(D.salt), iterations:D.iter, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:bin(D.iv)}, key, bin(D.ct));
  return new TextDecoder().decode(pt);
}
async function tryCode(code, silent){
  if(!code) return;
  btn.disabled = true; msg.className = "msg"; msg.textContent = "Unlocking…";
  try{
    const html = await unlock(code);
    try{ sessionStorage.setItem("fs-code", code); }catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){
    btn.disabled = false;
    if(silent){ msg.textContent = ""; }
    else { msg.className = "msg err"; msg.textContent = "That code didn't work — check it and try again."; inp.select(); }
  }
}
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); tryCode(inp.value.trim(), false); });
try{ const s = sessionStorage.getItem("fs-code"); if(s) tryCode(s, true); }catch(e){}
